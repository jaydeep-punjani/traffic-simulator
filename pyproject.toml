[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficsim"
version = "0.1.0"
description = "Application traffic simulator that drives realistic Segment events for streaming, e-commerce and gaming apps"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Topic :: Software Development :: Testing :: Traffic Generation",
]
# segment-analytics-python 2.x: emitter.SimConsumer subclasses its Consumer; keep below 3.
dependencies = [
  "segment-analytics-python>=2.3,<3",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6,<3",
  "pyyaml>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "types-requests",
]

[project.scripts]
trafficsim = "trafficsim.cli:main"

# Scenarios, catalogs and the example destinations file live at the repo root for
# editing; wheels bundle a copy under trafficsim/_data (see config._find_home).
[tool.setuptools]
packages = [
  "trafficsim",
  "trafficsim.api",
  "trafficsim.verticals",
  "trafficsim.dashboard",
  "trafficsim._data.scenarios",
  "trafficsim._data.catalogs",
  "trafficsim._data.config",
]

[tool.setuptools.package-dir]
"trafficsim._data.scenarios" = "scenarios"
"trafficsim._data.catalogs" = "catalogs"
"trafficsim._data.config" = "config"

[tool.setuptools.package-data]
"trafficsim.dashboard" = ["*.html", "*.js", "*.css", "vendor/*"]
"trafficsim._data.scenarios" = ["*.yaml"]
"trafficsim._data.catalogs" = ["*.yaml"]
"trafficsim._data.config" = ["*.example.yaml"]

[tool.setuptools.exclude-package-data]
"trafficsim._data.config" = ["destinations.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["trafficsim"]
concurrency = ["thread", "multiprocessing"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["trafficsim/dashboard/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "C4", "PIE", "RET", "ASYNC"]
ignore = [
  "S311",     # random is used for simulation, not cryptography
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # complexity/magic numbers in model code
  "RUF001", "RUF002", "RUF003",  # unicode punctuation in prose
  "SIM108",
  "RET504", "RET505",
  "PLW0603",
  "PLC0415",  # lazy imports keep CLI start-up fast and avoid import cycles
  "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S105", "S106", "PLC0415", "B017"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
