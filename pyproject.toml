[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficsim"
version = "0.1.0"
description = "Application traffic simulator that drives realistic Segment events for streaming, e-commerce and gaming apps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "segment-analytics-python>=2.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
trafficsim = "trafficsim.cli:main"

[tool.setuptools.packages.find]
include = ["trafficsim*"]

[tool.setuptools.package-data]
trafficsim = ["dashboard/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
