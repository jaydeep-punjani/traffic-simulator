version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        patterns: ["pytest*", "ruff", "mypy", "types-*", "httpx", "pre-commit"]
      runtime:
        patterns: ["*"]
        exclude-patterns: ["pytest*", "ruff", "mypy", "types-*", "httpx", "pre-commit"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
